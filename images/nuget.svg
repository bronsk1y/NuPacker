<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow for GNOME 2 Desktop Style -->
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Inner Cutout Shadow Effect for Holes -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Tango Classic Blue Linear Gradient -->
    <linearGradient id="tangoBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d6ea4"/>
      <stop offset="35%" stop-color="#18568c"/>
      <stop offset="100%" stop-color="#073863"/>
    </linearGradient>

    <!-- Glossy Reflection Overlay for GNOME 2 Style -->
    <linearGradient id="glossOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50.1%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Highlight Stroke Gradient for Top Bevel Effect -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Mask to Cut Holes Out of the Main Rounded Square -->
    <mask id="mainBodyMask">
      <!-- White base keeps full opacity -->
      <rect x="0" y="0" width="512" height="512" fill="#ffffff" />
      <!-- Black circles punch holes through the main body -->
      <circle cx="218" cy="226" r="46" fill="#000000" />
      <circle cx="356" cy="358" r="72" fill="#000000" />
    </mask>
  </defs>

  <!-- Background Canvas Padding -->
  <rect width="512" height="512" fill="none"/>

  <!-- ICON CONTAINER WITH DROP SHADOW -->
  <g filter="url(#drop-shadow)">
    
    <!-- ================= TOP-LEFT SEPARATE CIRCLE ================= -->
    <!-- Dark Outer Outline -->
    <circle cx="76" cy="84" r="36" fill="none" stroke="#041f38" stroke-width="6"/>
    <!-- Main Circle Fill -->
    <circle cx="76" cy="84" r="34" fill="url(#tangoBlueGrad)"/>
    <!-- Glossy Highlight -->
    <circle cx="76" cy="84" r="34" fill="url(#glossOverlay)"/>
    <!-- Inner Bevel/Highlight Ring -->
    <circle cx="76" cy="84" r="32" fill="none" stroke="url(#topHighlight)" stroke-width="2"/>

    <!-- ================= MAIN LARGE LOGO BODY ================= -->
    <!-- Base Shape with Cutouts applied -->
    <rect x="130" y="130" width="340" height="340" rx="90" ry="90" 
          fill="url(#tangoBlueGrad)" 
          mask="url(#mainBodyMask)" />

    <!-- Glossy Gel Overlay -->
    <rect x="130" y="130" width="340" height="340" rx="90" ry="90" 
          fill="url(#glossOverlay)" 
          mask="url(#mainBodyMask)" />

    <!-- Top/Inner Rim Glass Highlight -->
    <rect x="132" y="132" width="336" height="336" rx="88" ry="88" 
          fill="none" 
          stroke="url(#topHighlight)" 
          stroke-width="3" 
          mask="url(#mainBodyMask)" />

    <!-- Outer Dark Stroke Lines -->
    <rect x="130" y="130" width="340" height="340" rx="90" ry="90" 
          fill="none" 
          stroke="#041f38" 
          stroke-width="6"/>

    <!-- Hole 1 Inner Border (Top-Left Cutout) -->
    <circle cx="218" cy="226" r="46" fill="none" stroke="#041f38" stroke-width="5"/>
    <circle cx="218" cy="226" r="45" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Hole 2 Inner Border (Bottom-Right Cutout) -->
    <circle cx="356" cy="358" r="72" fill="none" stroke="#041f38" stroke-width="5"/>
    <circle cx="356" cy="358" r="71" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  </g>
</svg>